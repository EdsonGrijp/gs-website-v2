<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Grijp Systems</title>

        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/sections.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body>
        <header class="header">

            <div class="container">

                <a href="#" class="logo">
                    <img src="assets/logo/grijplogohorizontall.png" alt="Grijp Systems">
                </a>

                <nav class="navbar">

                    <ul class="nav-list">

                        <li><a href="#">Início</a></li>

                        <li><a href="#">Soluções</a></li>

                        <li><a href="#">Tecnologias</a></li>

                        <li><a href="#">Projetos</a></li>

                        <li><a href="#">Contato</a></li>

                    </ul>

                </nav>

                <a href="#" class="btn btn-primary">
                    Fale Conosco
                </a>

            </div>

        </header>

        <section class="hero">
            
            <div class="container hero-content">
                <div class="hero-text">
                    <span class="hero-tag">
                        Soluções em Tecnologia
                    </span>
                    <h1>
                        Transformando ideias em soluções digitais.
                    </h1>
                    <p>
                        Desenvolvemos soluções modernas, escaláveis e eficientes para impulsionar empresas através da tecnologia.
                    </p>
                    <div class="hero-buttons">
                        <a href="#" class="btn">
                            Conheça nossos serviços
                        </a>
                        <a href="#" class="btn btn-outline">
                            Fale conosco
                        </a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="assets/images/fundohero.png" alt="Infraestrutura tecnológica da Grijp Systems">
                </div>
            </div>
